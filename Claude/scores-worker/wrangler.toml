# Cloudflare Worker for the shared Lightloom high-score list.
name = "lightloom-scores"
main = "worker.js"
compatibility_date = "2025-09-01"

[[d1_databases]]
binding = "DB"
database_name = "lightloom-scores"
# Placeholder. `wrangler d1 create lightloom-scores` prints the real id to put here.
database_id = "00000000-0000-0000-0000-000000000000"
